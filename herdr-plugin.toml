id = "asaty94.animals"
name = "animals"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Agents 一覧のエージェント名に、決めた順番で動物の絵文字を付ける（例: 🐶 kiro）"
platforms = ["macos", "linux"]

[[startup]]
command = ["bash", "animals.sh"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "animals.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "animals.sh"]

[[events]]
on = "pane.exited"
command = ["bash", "animals.sh"]

[[events]]
on = "pane.closed"
command = ["bash", "animals.sh"]

[[actions]]
id = "refresh"
title = "Animals: 動物を付け直す"
contexts = ["global"]
command = ["bash", "animals.sh"]
